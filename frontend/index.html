<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="description" content="MyX is a private personal life manager: money, tasks, notes, memories and daily checklists in one fast app. Free, installable, no ads or trackers." />
    <link rel="canonical" href="https://myx.samchitech.com/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / social cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MyX" />
    <meta property="og:url" content="https://myx.samchitech.com/" />
    <meta property="og:title" content="MyX — Your Life, Organized" />
    <meta property="og:description" content="Money, tasks, notes, memories and daily checklists in one private, fast app. Free and installable." />
    <meta property="og:image" content="https://myx.samchitech.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MyX — Your Life, Organized" />
    <meta name="twitter:description" content="Money, tasks, notes, memories and daily checklists in one private, fast app." />
    <meta name="twitter:image" content="https://myx.samchitech.com/og-image.png" />

    <!-- PWA: installable app shell. iOS ignores the manifest's display mode, so
         it needs its own meta tags to launch without Safari chrome. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MyX" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "MyX",
        "url": "https://myx.samchitech.com/",
        "description": "A private personal life manager for money, tasks, notes, memories and daily checklists.",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <title>MyX — Your Life, Organized</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

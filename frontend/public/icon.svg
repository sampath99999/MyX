<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MyX">
  <!--
    The canonical brand mark. Every PNG in this folder is rendered from this
    file by scripts/icons.mjs, and src/components/Logo.tsx redraws the same
    geometry for the UI.

    The stops are the theme's brand token resolved to hex: oklch(0.62 0.19 285)
    is #7e6ef2, and these sit either side of it. A file loaded as a favicon
    cannot read the page's custom properties, so this is the one place the
    colour is written out by hand. Change the brand token in index.css and
    these two values have to move with it. (No double hyphens in here: an XML
    comment may not contain them, and the renderer refuses the file outright.)
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#968dfd"/>
      <stop offset="1" stop-color="#6b55df"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="133" fill="url(#g)"/>
  <g transform="translate(256 256) scale(12.4) translate(-12 -12)"
     fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
    <path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/>
  </g>
</svg>
